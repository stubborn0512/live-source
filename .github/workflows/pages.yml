name: Deploy live-source dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "output/status.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare dashboard data
        run: |
          set -eu
          mkdir -p docs/data
          cp output/status.json docs/data/status.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
