name: Test failover gateway

on:
  workflow_dispatch:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/test-gateway.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Health check
        run: |
          set -eux
          curl --fail --show-error --max-time 30             https://live-source-gateway.onrender.com/health | tee /tmp/health.json
          test "$(jq -r '.ok' /tmp/health.json)" = "true"
          test "$(jq -r '.channels' /tmp/health.json)" -ge 1

      - name: Playlist check
        run: |
          set -eux
          curl --fail --show-error --max-time 60             https://live-source-gateway.onrender.com/playlist.m3u -o /tmp/playlist.m3u
          grep -F 'tvg-id="cctv1"' /tmp/playlist.m3u
          test "$(grep -Fc 'tvg-id="cctv1"' /tmp/playlist.m3u)" -eq 1
          grep -F 'CCTV-1 综合' /tmp/playlist.m3u
          echo "CCTV-1 appears exactly once"

      - name: Stream smoke test
        run: |
          set -eux
          timeout 60s ffmpeg -hide_banner -loglevel warning             -rw_timeout 15000000             -i https://live-source-gateway.onrender.com/stream/cctv1             -t 15 -map 0:v:0 -f null -
