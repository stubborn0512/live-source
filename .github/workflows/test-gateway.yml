name: Test failover gateway

on:
  workflow_dispatch:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/test-gateway.yml"

concurrency:
  group: gateway-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq

      - name: Health check
        run: |
          set -eux
          curl --fail --show-error --max-time 30             https://live-source-gateway.onrender.com/health | tee /tmp/health.json
          test "$(jq -r '.ok' /tmp/health.json)" = "true"
          test "$(jq -r '.channels' /tmp/health.json)" -ge 1

      - name: Playlist check
        run: |
          set -eux
          curl --fail --show-error --max-time 60             https://live-source-gateway.onrender.com/playlist.m3u -o /tmp/playlist.m3u
          grep -F 'tvg-id="cctv1"' /tmp/playlist.m3u
          test "$(grep -Fc 'tvg-id="cctv1"' /tmp/playlist.m3u)" -eq 1
          grep -F 'CCTV-1 综合' /tmp/playlist.m3u
          echo "CCTV-1 appears exactly once"

      - name: Stream smoke test
        run: |
          set -eux
          timeout 60s ffmpeg -hide_banner -loglevel warning             -rw_timeout 15000000             -i https://live-source-gateway.onrender.com/stream/cctv1             -t 15 -map 0:v:0 -f null -


      - name: Local HLS remux test
        run: |
          set -eux
          source="$(curl --fail --show-error --max-time 30 https://raw.githubusercontent.com/stubborn0512/live-source/main/output/status.json | jq -r '.channels[] | select(.id=="cctv1") | .sources[0].url')"
          rm -rf /tmp/hls-test && mkdir -p /tmp/hls-test
          timeout 45s ffmpeg -hide_banner -loglevel warning \
            -rw_timeout 15000000 -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -i "$source" -map 0:v:0? -map 0:a:0? -c copy \
            -f hls -hls_time 2 -hls_list_size 4 \
            -hls_flags delete_segments+append_list+omit_endlist \
            -hls_segment_filename /tmp/hls-test/seg_%06d.ts /tmp/hls-test/index.m3u8 &
          pid=$!
          for i in $(seq 1 30); do
            if grep -q '#EXTINF:' /tmp/hls-test/index.m3u8 2>/dev/null; then
              echo "Local HLS remux works"
              kill "$pid" || true
              wait "$pid" || true
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "ffmpeg exited before producing HLS" >&2
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for local HLS output" >&2
          kill "$pid" || true
          exit 1

      - name: HLS smoke test
        run: |
          set -eux
          curl --fail --show-error --retry 20 --retry-all-errors --retry-delay 2 --max-time 10 \
            https://live-source-gateway.onrender.com/hls/cctv1/index.m3u8 \
            -o /tmp/cctv1.m3u8
          grep -F '#EXTM3U' /tmp/cctv1.m3u8
          grep -F '#EXTINF:' /tmp/cctv1.m3u8
          segment_url="$(grep -v '^#' /tmp/cctv1.m3u8 | head -n 1)"
          segment_url="https://live-source-gateway.onrender.com${segment_url}"
          echo "Testing first proxied segment"
          curl --fail-with-body --show-error --max-time 20 "$segment_url" -o /tmp/first-segment.ts || {
            echo "First segment proxy failed; response above is diagnostic." >&2
            exit 1
          }
          test -s /tmp/first-segment.ts
          timeout 75s ffmpeg -hide_banner -loglevel warning \
            -rw_timeout 15000000 \
            -i https://live-source-gateway.onrender.com/hls/cctv1/index.m3u8 \
            -t 15 -map 0:v:0 -f null -
