name: Test live source dispatcher

on:
  workflow_dispatch:
  push:
    paths:
      - "output/**"
      - ".github/workflows/test-gateway.yml"

concurrency:
  group: dispatcher-public-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          set -eux
          curl --fail --show-error --max-time 30 https://live-source-gateway.onrender.com/health | tee /tmp/health.json
          test "$(jq -r '.ok' /tmp/health.json)" = "true"
          test "$(jq -r '.dispatch_mode' /tmp/health.json)" = "direct-source-preferred"

      - name: Resolve check
        run: |
          set -eux
          curl --fail --show-error --max-time 30 https://live-source-gateway.onrender.com/resolve/cctv1 -o /tmp/resolve.json
          jq -e '.ok == true and .channel_id == "cctv1" and (.sources | length >= 2)' /tmp/resolve.json
          jq -r '.sources[0].url' /tmp/resolve.json

      - name: Source pool check
        run: |
          set -eux
          curl --fail --show-error --max-time 30 https://live-source-gateway.onrender.com/resolve/cctv1 -o /tmp/resolve.json
          source="$(jq -r '.sources[0].url' /tmp/resolve.json)"
          curl --fail --show-error --max-time 30 "$source" -o /tmp/upstream.m3u8
          grep -F '#EXTM3U' /tmp/upstream.m3u8
          grep -Eq '#EXTINF:|#EXT-X-STREAM-INF:' /tmp/upstream.m3u8
