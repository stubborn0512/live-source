name: Update live sources

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "output/**"
  schedule:
    # GitHub Actions cron is UTC; 18:00 UTC = 02:00 China Standard Time (UTC+8).
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: live-source-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve and check streams
        run: |
          python main.py
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("output/status.json").read_text(encoding="utf-8"))
          count = int(status.get("count", 0))
          if count < 10:
              raise SystemExit(f"Refusing to publish an incomplete playlist: {count} verified channels")
          print(f"Validated {count} channels before publish")
          PY

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: update live sources"
          git pull --rebase origin main
          git push
