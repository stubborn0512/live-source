<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>果幕｜线路中心</title>
<link rel="stylesheet" href="./style.css?v=20260930-2">
</head>
<body>
<header class="topbar"><div><div class="eyebrow">GUOMU · LIVE SOURCE</div><h1>线路中心</h1><p>清晰度优先，延迟其次，稳定性辅助判断。</p></div><nav class="nav"><a class="nav-link active" href="./index.html">线路检测</a><a class="nav-link" href="./player.html">网页播放</a><button id="refreshBtn" class="btn primary">刷新数据</button></nav></header>
<main class="container">

<section class="stats" id="stats"></section>
<section class="toolbar"><input id="search" class="input" type="search" placeholder="搜索频道，如 CCTV-1 / 湖南卫视"><select id="group" class="input"><option value="">全部分组</option></select><select id="qualityFilter" class="input"><option value="">全部线路</option><option value="1080">仅 1080P</option><option value="720">仅 720P</option><option value="other">其他清晰度</option></select><select id="sortMode" class="input"><option value="quality">按清晰度→延迟排序</option><option value="latency">按延迟排序</option><option value="name">按频道名称</option></select></section>
<section id="status" class="status">正在读取最新数据…</section><section id="channels" class="channel-grid"></section>
</main>
<template id="channelTpl"><article class="channel-card"><div class="channel-head"><div><div class="channel-name"></div><div class="channel-id"></div></div><span class="pill count"></span></div><div class="meta-line"></div><div class="source-list"></div></article></template>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script src="./app.js?v=20260930-2"></script>
</body></html>
